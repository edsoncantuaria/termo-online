<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14111c" />
    <title>Termo — sem conexão</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #14111c;
        color: #e8e4ef;
        font-family:
          Outfit,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .pagina {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      .icone {
        width: 5.5rem;
        height: 5.5rem;
        border-radius: 1.35rem;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 20rem;
        font-size: 0.92rem;
        line-height: 1.55;
        color: #a39fb0;
      }
      p strong {
        color: #7bc47f;
        font-weight: 600;
      }
      .btn {
        margin-top: 0.5rem;
        padding: 0.7rem 1.35rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(145deg, #5fad62, #3d8a40);
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .marca {
        margin-top: auto;
        padding-top: 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b6578;
      }
    </style>
  </head>
  <body>
    <main class="pagina">
      <img
        class="icone"
        src="/pwa-192.png"
        width="88"
        height="88"
        alt=""
        aria-hidden="true"
      />
      <h1>Você está sem internet</h1>
      <p>
        Conecte-se para jogar online. O modo <strong>Prática</strong> no
        dispositivo funciona offline depois que você abriu o jogo pelo menos uma
        vez com rede.
      </p>
      <button type="button" class="btn" id="btn-tentar">Tentar novamente</button>
      <p class="marca">Termo · Cloudive</p>
    </main>
    <script>
      document.getElementById("btn-tentar").addEventListener("click", function () {
        if (navigator.onLine) {
          location.replace("/");
        } else {
          location.reload();
        }
      });
      window.addEventListener("online", function () {
        location.replace("/");
      });
    </script>
  </body>
</html>
